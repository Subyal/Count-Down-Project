<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./Assets/favicon.ico" type="image/x-icon">
    <title>CountDown Time Project</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="main-container">
        <div id="overlay">
            <div id="topsection">
                <h3 id="companyname">Coming Soon</h3>
                <div id="social-icon">
                    <img id="icon" src="./Assets/Social icon.png" alt="">
                </div>
            </div>
            <div id="middle-section">
                <div id="mainheading">
                    <p id="mainheadindtext">
                        THE ADVNATURE BEGINS
                    </p>
                    <div id="endDate">16 Nov 2026 05:00 PM </div>
                    <p id="displaytext">
                        Hold tight as we get our tradng robots upgraded and make them more profitable for you.
                    </p>
                </div>
            </div>

            <div id="counter-container">
                <div><label for="">Months</label>
                    <input type="text" readonly>
                </div>

                <div> <label for="">Days</label>
                    <input type="text" readonly>
                </div>

                <div> <label for="">Hours</label>
                    <input type="text" readonly>
                </div>

                <div> <label for="">Minutes</label>
                    <input type="text" readonly>
                </div>

                <div> <label for="">Seconds</label>
                    <input type="text" readonly>
                </div>

            </div>

            <div id="btndiv">
                <button id="btn">Contact Us on WhatsApp</button>
            </div>

        </div>
    </div>


    <script src="countdown.js"></script>
</body>
